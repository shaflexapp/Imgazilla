# .github/workflows/ci.yml
#
# Lints, type-checks and builds the Figma plugin on every push and pull request.
# The built dist/ is uploaded as "plugin-dist-<commit sha>", so a build that is
# published to Figma by hand can be traced back to its commit.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Keep every main build so each commit there gets its artifact.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are not needed on the runner.
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn typecheck

      - name: Build (production)
        run: yarn build
        env:
          # There is no .env in CI. webpack then reads the build environment,
          # and a production build requires BASE_API_URL.
          BASE_API_URL: https://imgazilla.app/api

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          # For pull requests github.sha is the temporary merge commit, so use the head commit.
          name: plugin-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
